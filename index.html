<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>30-Day Strategy Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --panel:#1a1a1a;
    --panel-hi:#1f1f1f;
    --border:#292929;
    --turq:#00E5D1;
    --turq-dim:#0a4941;
    --text:#FAFAF8;
    --muted:#8f8a82;
    --copper:#C76A2E;
    --burgundy:#8B2635;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none!important}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}

  .head{
    padding:36px 0 26px;
    border-bottom:1px solid var(--border);
  }
  .head-eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .head-title{
    font-family:'Playfair Display',serif;
    font-weight:900;
    font-size:clamp(1.9rem,4.5vw,2.7rem);
    line-height:1.05;
    letter-spacing:-.5px;
  }
  .shimmer{
    background:linear-gradient(90deg,var(--turq-dim) 0%,#147a6c 16%,var(--turq) 32%,#FFFFFF 50%,var(--turq) 68%,var(--turq-dim) 100%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{to{background-position:200% center}}
  .head-sub{color:var(--muted);font-size:14.5px;line-height:1.65;margin-top:14px;max-width:60ch}

  .progress-row{display:flex;align-items:center;gap:14px;margin-top:22px}
  .progress-track{flex:1;height:6px;background:#262626;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:var(--turq);transition:width .5s ease}
  .progress-count{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right}

  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
    padding:30px 0 60px;
  }
  @media(max-width:640px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 19px;
    transition:transform .2s ease,border-color .2s ease;
    cursor:pointer;
    position:relative;
  }
  .card:not(.locked):hover{transform:translateY(-3px);border-color:var(--turq)}
  .card:not(.locked):active{transform:translateY(0);border-color:var(--turq);background:rgba(0,229,209,.08)}
  .card.locked{opacity:.42;cursor:default}
  .card.done{border-color:rgba(0,229,209,.5)}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .card-num{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .card-state{font-size:10.5px;font-weight:600}
  .card-state.locked-tag{color:var(--muted)}
  .card-state.done-tag{color:var(--turq)}
  .card-title{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:1.15rem;
    line-height:1.22;
    margin-bottom:8px;
  }
  .card-meta{font-size:12px;color:var(--muted)}
  .card-unlock-date{font-size:11.5px;color:var(--muted);margin-top:8px}

  /* detail screen */
  .detail{padding:40px 0 70px}
  .back{
    background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;margin-bottom:26px;cursor:pointer;
  }
  .back:hover{color:var(--text)}
  .back:active{color:var(--turq)}
  .detail-eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
  .detail-title{
    font-family:'Playfair Display',serif;font-weight:900;
    font-size:clamp(2rem,5vw,3rem);line-height:1.04;letter-spacing:-.5px;margin-bottom:18px;
  }
  .detail-body{font-size:15px;line-height:1.75;color:#d8d5cf;max-width:62ch;margin-bottom:26px}
  .tool-box{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px 22px;margin-bottom:20px;
  }
  .tool-box-label{font-size:11px;letter-spacing:1.5px;color:var(--turq);text-transform:uppercase;margin-bottom:10px}
  .tool-box-name{font-family:'Playfair Display',serif;font-weight:700;font-size:1.3rem;margin-bottom:14px}
  .tool-link{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--turq);color:#0c0c0c;font-weight:700;font-size:13px;
    padding:12px 20px;border-radius:10px;
  }
  .no-tool-note{color:var(--muted);font-size:13.5px;font-style:italic}

  .phrase-line{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
    font-size:1.35rem;color:var(--turq);margin-bottom:24px;line-height:1.4;
  }

  .section-label{font-size:11px;letter-spacing:1.5px;color:var(--copper);text-transform:uppercase;margin-bottom:10px}
  .section-block{margin-bottom:26px}
  .section-text{font-size:15px;line-height:1.75;color:#d8d5cf;max-width:62ch}

  .complete-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .complete-btn{
    background:transparent;border:1.5px solid var(--turq);color:var(--turq);
    padding:12px 20px;border-radius:10px;font-weight:700;font-size:13px;
    transition:background .2s ease,color .2s ease;
    position:relative;overflow:hidden;
  }
  .complete-btn.is-done{background:var(--turq);color:#0c0c0c}
  .complete-btn:active{background:rgba(0,229,209,.25);color:var(--turq)}
  .complete-btn.is-done:active{background:#00c2b0}
  .pulse-ring{position:absolute;inset:-2px;border-radius:12px;border:2px solid var(--turq);opacity:0;pointer-events:none}
  .pulse-ring.go{animation:pulseRing .9s ease-out}
  @keyframes pulseRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}

  .locked-screen{padding:60px 0;text-align:center;color:var(--muted)}
  .locked-screen .lock-title{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--text);margin-bottom:10px}
</style>
</head>
<body>

<div class="wrap">
  <div class="head" id="homeHead">
    <div class="head-eyebrow">Fearless Workplace</div>
    <div class="head-title">Toxic Workplace <span class="shimmer">Strategy Challenge</span></div>
    <p class="head-sub">A 30 day challenge. One strategy unlocks each day of September, and stays open once it's live so you can work through it at your own pace.</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">0 / 30</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="detail" id="detailScreen" hidden>
    <button class="back" id="backBtn">&larr; Back to all strategies</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ═══════════ CONFIG ═══════════
     Change this one line to relaunch for a future cohort. */
  const CHALLENGE_START_DATE = '2026-09-01';

  /* Fill in real tool links as they're finalized. Blank = no tool, card-only day. */

  const TOOL_LINKS = {
    1: { name: 'Coping Skills Library', url: 'https://fearlessworkplace-stack.github.io/coping/' },
    2: { name: 'Threat Response Mirror Tool', url: 'https://fearlessworkplace-stack.github.io/threatresponse/' },
    12: { name: 'Pushback Scripts / Workshop', url: 'https://fearlessworkplace-stack.github.io/pushback/' },
    13: { name: 'Hold the Line', url: 'https://fearlessworkplace-stack.github.io/holdtheline/' },
    14: { name: 'Interactive Assessment Tool', url: 'https://fearlessworkplace-stack.github.io/holdtheline/' },
    16: { name: 'Documentation Starter Guide', url: '' },
    17: { name: 'Documentation Toolkit', url: 'https://fearlessworkplace-stack.github.io/documentationtoolkit/' },
    18: { name: 'Documentation Toolkit', url: 'https://fearlessworkplace-stack.github.io/documentationtoolkit/' },
    20: { name: 'Conflict Style Compass', url: 'https://fearlessworkplace-stack.github.io/conflictcompass/' },
    21: { name: 'Conflict Style Compass', url: 'https://fearlessworkplace-stack.github.io/conflictcompass/' },
    22: { name: 'Conflict Style Compass', url: 'https://fearlessworkplace-stack.github.io/conflictcompass/' },
    23: { name: 'Map the Power Tool', url: 'https://fearlessworkplace-stack.github.io/powermaptool/' },
    26: { name: 'Build the Case Tool', url: 'https://fearlessworkplace-stack.github.io/buildthecase/' }
  };

  function phaseFor(n){
    const s = STRATEGIES.find(s => s.n === n);
    return s ? s.category : '';
  }

  const STRATEGIES = [
    { n:1, title:'Regulate Before You Respond', category:'Regulation', phrase:'Get enough control back before deciding what to do.', why:'High activation narrows your thinking and pushes you toward the fastest reaction instead of the best one. Regulating first when a workplace threat hits keeps the first reaction from making the decision for you.', how:'Use a regulation tool before you explain, defend, decide, or react. The goal is enough control to think strategically.' },
    { n:2, title:'Recognize Your Threat Response', category:'Self-Awareness', phrase:'Know what your brain defaults to under threat.', why:'Fight, flight, freeze, or fawn can feel like a choice while it is happening, even though it is really just a pattern running without your input. Naming your default gives you the option to follow it or not.', how:'Recognize fight, flight, freeze, or fawn patterns and how they shape what you do next.' },
    { n:3, title:'Take the Strategic Pause', category:'Boundary / Regulation', phrase:'You do not owe anybody an immediate response.', why:'Urgency from someone else does not obligate an immediate answer from you. A pause creates room to think instead of reacting straight out of pressure.', how:'Create time between pressure and response so you can choose the strategy instead of reacting.' },
    { n:4, title:'Separate Fact From Story', category:'Cognitive Strategy', phrase:'Separate what happened from what you think it means.', why:'Facts, assumptions, motives, and predictions blur together fast, and once they do it becomes hard to respond to what actually happened instead of what you have concluded it means. Sorting them keeps your strategy built on solid ground.', how:'Sort observable facts from interpretation before deciding motive, risk, or response.' },
    { n:5, title:'Recognize the Pattern', category:'Pattern Recognition', phrase:'One incident can be noise. Repetition gives you information.', why:'A single incident can be ambiguous, but repetition tells you something. Naming the specific tactic instead of reacting to a vague sense of wrongness gives you a starting point for a real response.', how:'Track recurring behavior and identify the tactic before deciding how to respond.' },
    { n:6, title:'Use the SCARF Lens', category:'Threat Awareness', phrase:'Understand what is getting activated in the interaction.', why:'Not every rough interaction lands the same way. Something specific gets hit: status, certainty, autonomy, relatedness, or fairness. Naming the trigger tells you what you are actually responding to.', how:'Use status, certainty, autonomy, relatedness, and fairness to identify why a workplace interaction is landing as a threat.' },
    { n:7, title:'Detach Emotionally From Their Behavior', category:'Detachment', phrase:'Their intensity does not have to become your reaction.', why:'Anger, hostility, guilt trips, urgency, shaming, and sarcasm are designed to pull a reaction out of you. Creating distance from the bait keeps their intensity from becoming yours.', how:'Create psychological distance from anger, hostility, guilt trips, urgency, shaming, sarcasm, and other bait.' },
    { n:8, title:'Build Your Support System', category:'Support', phrase:'Do not let the workplace become your only reality check.', why:'Carrying a workplace problem without outside perspective makes it feel bigger and harder to evaluate accurately. Safe support outside the dynamic keeps you from turning every conversation into trauma-bond venting.', how:'Build safe support outside the immediate workplace dynamic and avoid turning support into endless trauma-bond venting.' },
    { n:9, title:'Stay Out of the Triangle', category:'Relational Strategy', phrase:'Notice when conflict is being routed through other people.', why:'Coalition-building, exclusion, and indirect communication move a conflict through other people instead of dealing with it directly. Naming the tactic keeps you from becoming part of someone else\'s conflict.', how:'Identify coalition-building, exclusion, and indirect communication that changes the power around a conflict.' },
    { n:10, title:'Assess Before You Vent', category:'Information Boundary', phrase:'Not everyone at work needs the same access to you.', why:'Frustration shared with the wrong person can travel further than intended and get used in ways you did not plan for. Calibrating what you share and with whom protects you when trust is uncertain.', how:'Calibrate what you share, with whom, and through which channel when trust is uncertain.' },
    { n:11, title:'Define the Line', category:'Boundary', phrase:'Decide your boundary before pressure tests it.', why:'A boundary invented in the middle of a conflict works more like a request than a limit. Deciding in advance what you will and will not accept gives the boundary something to stand on.', how:'Pre-decide what you will and will not accept so you are not inventing the boundary in the middle of the conflict.' },
    { n:12, title:'Push Back Professionally', category:'Communication', phrase:'Use the lowest level of force that still protects you.', why:'Jumping straight to the strongest response spends capital you might need later and can escalate a situation that a smaller move would have handled. Starting low and moving up only as needed keeps your options open.', how:'Start with a question, clarify the issue, and escalate the firmness only as needed.' },
    { n:13, title:'Hold the Line', category:'Boundary', phrase:'A boundary is not finished when someone dislikes it.', why:'Repeated explanation signals that pushing back reopens the issue. Staying consistent through guilt, fake urgency, exclusion, and criticism is what makes a boundary mean something over time.', how:'Expect pressure after pushback and stay consistent through guilt, fake urgency, exclusion, criticism, and attempts to reopen the decision.' },
    { n:14, title:'Build Your Tolerance for Discomfort', category:'Conflict Capacity', phrase:'Discomfort does not automatically mean the strategy is wrong.', why:'The urge to make discomfort stop right away is usually what leads to a worse decision than the discomfort itself. Most distress peaks and drops on its own if you let it run its course.', how:'Notice the reaction pattern that shows up after you hold a boundary and build the capacity to stay with the decision.' },
    { n:15, title:'Change the Climate', category:'Emotional Strategy', phrase:'Do not let one person\'s emotional state set the operating conditions for everyone else.', why:'Emotional contagion spreads through a team without anyone choosing it, and the loudest cynicism or volatility in the room usually wins by default. Protecting the tone on purpose keeps someone else\'s mood from setting the climate you operate in.', how:'Recognize emotional contagion and deliberately protect the tone, pace, and focus of the interaction.' },
    { n:16, title:'Create the Record', category:'Documentation', phrase:'Start the paper trail before you know you need it.', why:'A record built after a conflict starts looks reconstructed, while one built as a normal habit looks credible. Capturing decisions and instructions as they happen protects you long before you know you will need the proof.', how:'Capture changing deadlines, priorities, owners, instructions, and decisions in boring, factual documentation.' },
    { n:17, title:'Build Your Evidence File', category:'Documentation', phrase:'Preserve the material that can prove the pattern later.', why:'Stating your interpretation is easy to dismiss, but the underlying material speaks for itself. Saving the original instructions, praise, and changes lets a reader draw the same conclusion you did without being told what to think.', how:'Save before-and-after evidence such as earlier praise, prior instructions, original deadlines, policy application, and changed expectations.' },
    { n:18, title:'Document Your Wins', category:'Performance Protection', phrase:'Do not rely on memory to prove your value.', why:'Memory is unreliable and selective, especially for someone with a reason to remember you unfavorably. A running record of your own results means your competence does not depend on anyone else\'s recollection.', how:'Maintain a running record of results, improvements, praise, responsibilities, mentoring, training, and measurable contributions.' },
    { n:19, title:'Protect Your Reputation', category:'Reputation / Career Protection', phrase:'Do not let one manager become the sole narrator of your work.', why:'A single hostile narrator can shape how a whole team sees your work if nobody else has visibility into it. Real relationships and visible contributions give other people their own basis for judging you.', how:'Build authentic professional relationships, keep work visible, cultivate credible references, and strengthen your reputation outside one relationship.' },
    { n:20, title:'Know Your Conflict Style', category:'Conflict Strategy', phrase:'Know what you tend to do first when conflict shows up.', why:'Everyone defaults to a conflict style under pressure, and that default is not always the right tool for what is happening. Naming your pattern is the first step to choosing your response instead of running it automatically.', how:'Identify your default conflict response and notice how it changes depending on who has power in the interaction.' },
    { n:21, title:'Have the Crucial Conversation', category:'Direct Resolution', phrase:'Address the issue directly instead of spending weeks trying to decode it.', why:'A problem left undiscussed does not resolve itself, it just gets reinterpreted by everyone involved. A direct, structured conversation replaces the guessing with an actual answer.', how:'Use the DESC framework: describe what you have noticed without deciding motive, explain the impact, state what you need, and create space for a direct response.' },
    { n:22, title:'Flex Your Style', category:'Conflict Strategy', phrase:'Your default conflict response is not always the right response.', why:'The style that works with a peer will not always work with someone who holds power over you, and treating every conflict the same way limits what you can accomplish. Reading the situation and adjusting your approach is what makes conflict skill useful instead of habitual.', how:'Choose a conflict approach based on the situation, the stakes, the relationship, and the power dynamic instead of using the same instinct every time.' },
    { n:23, title:'Map the Power', category:'Organizational Strategy', phrase:'The org chart is not the power map.', why:'Formal titles do not always match who actually controls a decision. Mapping who influences whom and how they are connected tells you where an escalation or request can realistically go.', how:'Identify who can make the decision, who influences them, how key people are connected, and where an escalation or request can realistically go.' },
    { n:24, title:'Find Your Allies', category:'Organizational Strategy', phrase:'Do not wait until you need support to start building relationships.', why:'Relationships built during a crisis look transactional and rarely hold up under pressure. Genuine, mutual relationships built beyond your immediate circle make you harder to isolate.', how:'Build genuine, mutual relationships beyond your immediate circle so more people know your work, can help get things done, and make you harder to isolate.' },
    { n:25, title:'Escalate Strategically', category:'Escalation', phrase:'Direct resolution has a limit.', why:'Some situations genuinely cannot be resolved at the level where they started, and waiting too long to move them can cost you options. Assessing seriousness, prior attempts, and power imbalance tells you when it is time to take the issue higher.', how:'Assess the seriousness of the issue, what you have already tried, the power imbalance, the risk of waiting, and whether the problem now needs a higher or outside level of response.' },
    { n:26, title:'Build the Case', category:'Escalation / Documentation', phrase:'A pile of receipts is not automatically a strong case.', why:'A stack of complaints is harder to act on than a clear, organized concern. Structuring what you already have into a problem, its impact, and a specific ask is what makes escalation land.', how:'Organize the issue around the problem, its impact, the strongest evidence, what you have already tried, and a specific ask another person can act on.' },
    { n:27, title:'Manage Up Strategically', category:'', phrase:'', why:'', how:'', pending:true },
    { n:28, title:'Choose Your Battles', category:'', phrase:'', why:'', how:'', pending:true },
    { n:29, title:'Expand Your Options', category:'', phrase:'', why:'', how:'', pending:true },
    { n:30, title:'Build Your Exit Strategy', category:'', phrase:'', why:'', how:'', pending:true }
  ];

  function unlockDate(n){
    const start = new Date(CHALLENGE_START_DATE + 'T00:00:00');
    const d = new Date(start);
    d.setDate(d.getDate() + (n - 1));
    return d;
  }
  function isUnlocked(n){
    const today = new Date();
    today.setHours(0,0,0,0);
    return unlockDate(n) <= today;
  }
  function formatDate(d){
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }

  function getDone(){
    try { return JSON.parse(localStorage.getItem('fw_challenge_done')||'{}'); }
    catch(e){ return {}; }
  }
  function setDone(obj){
    try { localStorage.setItem('fw_challenge_done', JSON.stringify(obj)); } catch(e){}
  }

  const grid = document.getElementById('grid');
  const detailScreen = document.getElementById('detailScreen');
  const detailContent = document.getElementById('detailContent');
  const homeHead = document.getElementById('homeHead');
  const backBtn = document.getElementById('backBtn');

  function renderProgress(){
    const done = getDone();
    const count = Object.values(done).filter(Boolean).length;
    document.getElementById('progressFill').style.width = (count/30*100) + '%';
    document.getElementById('progressCount').textContent = count + ' / 30';
  }

  function renderGrid(){
    grid.innerHTML = '';
    const done = getDone();
    STRATEGIES.forEach(s => {
      const unlocked = isUnlocked(s.n);
      const isDone = !!done[s.n];
      const card = document.createElement('div');
      card.className = 'card' + (!unlocked ? ' locked' : '') + (isDone ? ' done' : '');
      if (unlocked) {
        card.innerHTML =
          '<div class="card-top">' +
            '<div class="card-num">Strategy ' + s.n + '</div>' +
            (isDone ? '<div class="card-state done-tag">&#10003; Done</div>' : '') +
          '</div>' +
          '<div class="card-title">' + s.title + '</div>' +
          '<div class="card-meta">' + phaseFor(s.n) + '</div>';
      } else {
        card.innerHTML =
          '<div class="card-top">' +
            '<div class="card-num">Strategy ' + s.n + '</div>' +
            '<div class="card-state locked-tag">Locked</div>' +
          '</div>' +
          '<div class="card-unlock-date">Unlocks ' + formatDate(unlockDate(s.n)) + '</div>';
      }
      if (unlocked) card.addEventListener('click', () => openDetail(s.n));
      grid.appendChild(card);
    });
  }

  function openDetail(n){
    const s = STRATEGIES.find(s => s.n === n);
    const unlocked = isUnlocked(n);
    homeHead.hidden = true;
    grid.hidden = true;
    detailScreen.hidden = false;

    if (!unlocked) {
      detailContent.innerHTML =
        '<div class="locked-screen"><div class="lock-title">Not unlocked yet</div>' +
        '<p>Strategy ' + n + ' unlocks ' + formatDate(unlockDate(n)) + '.</p></div>';
      return;
    }

    const done = getDone();
    const isDone = !!done[n];
    const tool = TOOL_LINKS[n];

    let bodyHtml;
    if (s.pending) {
      bodyHtml = '<p class="detail-body">Content for this strategy has not been written yet.</p>';
    } else if (s.why || s.how) {
      bodyHtml =
        (s.phrase ? '<p class="phrase-line">' + s.phrase + '</p>' : '') +
        (s.why ? '<div class="section-block"><div class="section-label">Why This Helps</div><p class="section-text">' + s.why + '</p></div>' : '') +
        (s.how ? '<div class="section-block"><div class="section-label">How To Do It</div><p class="section-text">' + s.how + '</p></div>' : '');
    } else {
      bodyHtml = '<p class="detail-body">' + s.body + '</p>';
    }

    let toolHtml = '';
    if (tool) {
      const boxLabel = tool.label || 'Today’s Tool';
      const ctaText = tool.cta || 'Open the tool';
      toolHtml =
        '<div class="tool-box">' +
          '<div class="tool-box-label">' + boxLabel + '</div>' +
          '<div class="tool-box-name">' + tool.name + '</div>' +
          (tool.url
            ? '<a class="tool-link" href="' + tool.url + '" target="_blank" rel="noreferrer">' + ctaText + ' &rarr;</a>'
            : '<span class="no-tool-note">Link coming soon.</span>') +
        '</div>';
    }

    detailContent.innerHTML =
      '<div class="detail-eyebrow">Strategy ' + n + (phaseFor(n) ? ' &middot; ' + phaseFor(n) : '') + '</div>' +
      '<h1 class="detail-title">' + s.title + '</h1>' +
      bodyHtml +
      toolHtml +
      '<div class="complete-row">' +
        '<button class="complete-btn' + (isDone ? ' is-done' : '') + '" id="completeBtn">' +
          '<span class="pulse-ring" id="pulseRing"></span>' +
          (isDone ? '&#10003; Marked Complete' : 'Mark Strategy Complete') +
        '</button>' +
      '</div>';

    document.getElementById('completeBtn').addEventListener('click', function(){
      const d = getDone();
      d[n] = !d[n];
      setDone(d);
      const ring = document.getElementById('pulseRing');
      ring.classList.remove('go');
      void ring.offsetWidth;
      if (d[n]) ring.classList.add('go');
      openDetail(n);
      renderProgress();
    });
  }

  backBtn.addEventListener('click', function(){
    detailScreen.hidden = true;
    homeHead.hidden = false;
    grid.hidden = false;
    renderGrid();
    renderProgress();
  });

  renderGrid();
  renderProgress();
})();
</script>
</body>
</html>
