<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>30-Day Strategy Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --panel:#1a1a1a;
    --panel-hi:#1f1f1f;
    --border:#292929;
    --turq:#00E5D1;
    --turq-dim:#0a4941;
    --text:#FAFAF8;
    --muted:#8f8a82;
    --copper:#C76A2E;
    --burgundy:#8B2635;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none!important}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}

  .head{
    padding:36px 0 26px;
    border-bottom:1px solid var(--border);
  }
  .head-eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .head-title{
    font-family:'Playfair Display',serif;
    font-weight:900;
    font-size:clamp(1.9rem,4.5vw,2.7rem);
    line-height:1.05;
    letter-spacing:-.5px;
  }
  .shimmer{
    background:linear-gradient(90deg,var(--turq-dim) 0%,#147a6c 16%,var(--turq) 32%,#FFFFFF 50%,var(--turq) 68%,var(--turq-dim) 100%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{to{background-position:200% center}}
  .head-sub{color:var(--muted);font-size:14.5px;line-height:1.65;margin-top:14px;max-width:60ch}

  .progress-row{display:flex;align-items:center;gap:14px;margin-top:22px}
  .progress-track{flex:1;height:6px;background:#262626;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:var(--turq);transition:width .5s ease}
  .progress-count{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right}

  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
    padding:30px 0 60px;
  }
  @media(max-width:640px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 19px;
    transition:transform .2s ease,border-color .2s ease;
    cursor:pointer;
    position:relative;
  }
  .card:not(.locked):hover{transform:translateY(-3px);border-color:var(--turq)}
  .card:not(.locked):active{transform:translateY(0);border-color:var(--turq);background:rgba(0,229,209,.08)}
  .card.locked{opacity:.42;cursor:default}
  .card.done{border-color:rgba(0,229,209,.5)}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
  .card-num{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .card-state{font-size:10.5px;font-weight:600}
  .card-state.locked-tag{color:var(--muted)}
  .card-state.done-tag{color:var(--turq)}
  .card-title{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:1.15rem;
    line-height:1.22;
    margin-bottom:8px;
  }
  .card-meta{font-size:12px;color:var(--muted)}
  .card-unlock-date{font-size:11.5px;color:var(--muted);margin-top:8px}

  /* detail screen */
  .detail{padding:40px 0 70px}
  .back{
    background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;margin-bottom:26px;cursor:pointer;
  }
  .back:hover{color:var(--text)}
  .back:active{color:var(--turq)}
  .detail-eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
  .detail-title{
    font-family:'Playfair Display',serif;font-weight:900;
    font-size:clamp(2rem,5vw,3rem);line-height:1.04;letter-spacing:-.5px;margin-bottom:18px;
  }
  .detail-body{font-size:15px;line-height:1.75;color:#d8d5cf;max-width:62ch;margin-bottom:26px}
  .tool-box{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px 22px;margin-bottom:20px;
  }
  .tool-box-label{font-size:11px;letter-spacing:1.5px;color:var(--turq);text-transform:uppercase;margin-bottom:10px}
  .tool-box-name{font-family:'Playfair Display',serif;font-weight:700;font-size:1.3rem;margin-bottom:14px}
  .tool-link{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--turq);color:#0c0c0c;font-weight:700;font-size:13px;
    padding:12px 20px;border-radius:10px;
  }
  .no-tool-note{color:var(--muted);font-size:13.5px;font-style:italic}

  .phrase-line{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
    font-size:1.35rem;color:var(--turq);margin-bottom:24px;line-height:1.4;
  }

  .section-label{font-size:11px;letter-spacing:1.5px;color:var(--copper);text-transform:uppercase;margin-bottom:10px}
  .section-block{margin-bottom:26px}
  .section-text{font-size:15px;line-height:1.75;color:#d8d5cf;max-width:62ch}

  .complete-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .complete-btn{
    background:transparent;border:1.5px solid var(--turq);color:var(--turq);
    padding:12px 20px;border-radius:10px;font-weight:700;font-size:13px;
    transition:background .2s ease,color .2s ease;
    position:relative;overflow:hidden;
  }
  .complete-btn.is-done{background:var(--turq);color:#0c0c0c}
  .complete-btn:active{background:rgba(0,229,209,.25);color:var(--turq)}
  .complete-btn.is-done:active{background:#00c2b0}
  .pulse-ring{position:absolute;inset:-2px;border-radius:12px;border:2px solid var(--turq);opacity:0;pointer-events:none}
  .pulse-ring.go{animation:pulseRing .9s ease-out}
  @keyframes pulseRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}

  .locked-screen{padding:60px 0;text-align:center;color:var(--muted)}
  .locked-screen .lock-title{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--text);margin-bottom:10px}
</style>
</head>
<body>

<div class="wrap">
  <div class="head" id="homeHead">
    <div class="head-eyebrow">Fearless Workplace</div>
    <div class="head-title">Toxic Workplace <span class="shimmer">Strategy Challenge</span></div>
    <p class="head-sub">A 30 day challenge. One strategy unlocks each day of September, and stays open once it's live so you can work through it at your own pace.</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">0 / 30</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="detail" id="detailScreen" hidden>
    <button class="back" id="backBtn">&larr; Back to all strategies</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ═══════════ CONFIG ═══════════
     Change this one line to relaunch for a future cohort. */
  const CHALLENGE_START_DATE = '2026-09-01';

  /* Fill in real tool links as they're finalized. Blank = no tool, card-only day. */

  const TOOL_LINKS = {
    1: { name: 'Coping Skills Library', url: 'https://fearlessworkplace-stack.github.io/coping/' },
    2: { name: 'Threat Response Mirror Tool', url: 'https://fearlessworkplace-stack.github.io/threatresponse/' },
    5: { name: 'Defense Matrix / Navigator', url: 'https://fearless-workp.replit.app/', label: 'Go Deeper', cta: 'Open the App' },
    6: { name: 'SCARF Reflection', url: 'https://fearlessworkplace-stack.github.io/scarf/' },
    8: { name: 'Community + Support Map', url: '' },
    11: { name: 'Boundary Exercise', url: '' },
    12: { name: 'Pushing Back Professionally', url: 'https://fearlessworkplace-stack.github.io/pushback/' },
    13: { name: 'Hold the Line', url: 'https://fearlessworkplace-stack.github.io/holdtheline/' },
    14: { name: 'Hold the Line', url: 'https://fearlessworkplace-stack.github.io/holdtheline/' },
    16: { name: 'Documentation Toolkit', url: 'https://fearlessworkplace-stack.github.io/documentationtoolkit/' },
    17: { name: 'Documentation Toolkit', url: 'https://fearlessworkplace-stack.github.io/documentationtoolkit/' },
    18: { name: 'Documentation Toolkit', url: 'https://fearlessworkplace-stack.github.io/documentationtoolkit/' },
    20: { name: 'Conflict Style Compass', url: 'https://fearlessworkplace-stack.github.io/conflictcompass/' },
    21: { name: 'Conflict Style Compass', url: 'https://fearlessworkplace-stack.github.io/conflictcompass/' },
    22: { name: 'Conflict Style Compass', url: 'https://fearlessworkplace-stack.github.io/conflictcompass/' },
    24: { name: 'Build the Case', url: '' },
    29: { name: 'Documentation Toolkit', url: '' },
    30: { name: 'Strategy Dashboard', url: '' }
  };

  function phaseFor(n){
    const s = STRATEGIES.find(s => s.n === n);
    return s ? s.category : '';
  }

  const STRATEGIES = [
    { n:1, title:'Regulate Before You Respond', category:'Regulation', phrase:'Get your nervous system out of the driver\'s seat.', why:'High activation narrows your thinking and pushes you toward the fastest reaction instead of the best one. Getting your body settled first gives you access to judgment that gets shut down under threat.', how:'Use one reliable regulation tool before you explain, defend, decide, or react. The goal is enough control to think strategically.' },
    { n:2, title:'Recognize Your Threat Response', category:'Self-Awareness', phrase:'Know what your brain does when it reads danger.', why:'Fight, flight, freeze, or fawn can feel like a choice while it is happening, even though it is really just a pattern running without your input. Naming your default gives you the option to follow it or not.', how:'Identify whether you default to fight, flight, freeze, or fawn, and notice the urge that comes with it before it chooses your response.' },
    { n:3, title:'Take the Strategic Pause', category:'Decision-Making', phrase:'You do not owe anybody an instant reaction.', why:'Urgency from someone else does not obligate an immediate answer from you. A pause creates room to think instead of reacting straight out of activation.', how:'Create time between the trigger and your response. Pause for minutes, hours, or days when needed so urgency does not make the decision for you.' },
    { n:4, title:'Separate Fact From Story', category:'Cognitive Discrimination', phrase:'Do I think so, or do I know so?', why:'Facts, assumptions, motives, and predictions blur together fast, and once they do it becomes hard to respond to what actually happened instead of what you have concluded it means. Sorting them keeps your strategy built on solid ground.', how:'Write down what could be verified by a witness, then separate interpretation, prediction, motive, and assumption from the observable facts.' },
    { n:5, title:'Recognize the Pattern', category:'Pattern Recognition', phrase:'Once you can name the pattern, it stops feeling random.', why:'A single incident can be ambiguous, but repetition tells you something. Naming the specific tactic instead of reacting to a vague sense of wrongness gives you a starting point for a real response.', how:'Classify what you are seeing instead of treating every incident as isolated: exclusion, intimidation, moving rules, reputation attacks, information control, blame shifting, reality distortion, or other repeatable tactics.' },
    { n:6, title:'Use the SCARF Lens', category:'Self-Awareness', phrase:'Figure out why this hits as hard as it does.', why:'Not every rough interaction lands the same way. Something specific gets hit, your status, your certainty, your control, your connection, or the fairness of how you were treated. Naming the trigger tells you what you are actually responding to.', how:'Identify whether the threat is to status, certainty, autonomy, relatedness, or fairness. Knowing the trigger helps you separate intensity from strategy.' },
    { n:7, title:'Detach Emotionally From Their Behavior', category:'Cognitive Reframe', phrase:'Their behavior can affect you without defining you.', why:'Personalizing someone else\'s dysfunction increases rumination and gives their opinion of you more weight than it has earned. Studying the broader pattern instead of just your interaction with them makes the behavior easier to see clearly.', how:'Study the broader pattern instead of making every interaction a verdict on you. Separate their behavior from your identity, reduce personalization, and keep your attention on what you can control.' },
    { n:8, title:'Build Your Support System', category:'Resource Building', phrase:'Work cannot be your only reality check.', why:'Carrying a workplace problem without outside perspective makes it feel bigger and harder to evaluate accurately. Different people are useful for different things, and naming which kind you need keeps you from defaulting to venting on repeat.', how:'Choose support outside work for different jobs: listening, reality-checking, problem-solving, perspective, and helping you stay connected to the rest of your life.' },
    { n:9, title:'Stay Out of the Triangle', category:'Manipulation Recognition', phrase:'Do not become somebody else\'s messenger, jury, or ammunition.', why:'Getting pulled into gossip, side-taking, or message-carrying creates exposure and can drag you into a conflict that was never yours. Redirecting people back to each other keeps the exposure where it belongs.', how:'Recognize triangulation, refuse side-taking, do not carry messages, and do not help build a case about someone based on claims you did not witness.' },
    { n:10, title:'Assess Before You Vent', category:'Information Boundary', phrase:'Your words can become material.', why:'Frustration shared with the wrong person can travel further than intended and get used in ways you did not plan for. Checking the audience and the risk before you speak protects you later.', how:'Before you share frustration, assess the audience, the relationship, the risk, and whether you would be comfortable hearing your exact words repeated to someone with power over you.' },
    { n:11, title:'Define the Line', category:'Boundary', phrase:'Know the line before somebody crosses it again.', why:'A boundary you cannot enforce works more like a request than a limit. Defining the specific behavior and what you will do if it happens again gives the boundary something to stand on.', how:'Identify the specific behavior you will no longer absorb, what your limit is, and what you will do when the line is crossed. Make the boundary something you can enforce.' },
    { n:12, title:'Push Back Professionally', category:'Communication Strategy', phrase:'Use the lowest level of pushback that still protects you.', why:'Jumping straight to the strongest response spends capital you might need later and can escalate a situation that a smaller move would have handled. Moving up the spectrum only as needed keeps your options open.', how:'Move up the response spectrum only as needed: question, clarify, correct, state the problem, then escalate when the situation or risk requires it.' },
    { n:13, title:'Hold the Line', category:'Boundary', phrase:'Every time you cave, you teach them how much pressure changes your no.', why:'Repeated explanation signals that pushing back reopens the issue. Holding steady without re-justifying is what makes a boundary mean something over time.', how:'Expect testing. Repeat the limit without adding new explanations, watch for tactic changes, and follow through when the behavior continues or escalates.' },
    { n:14, title:'Build Your Tolerance for Discomfort', category:'Distress Tolerance', phrase:'Build your tolerance for discomfort.', why:'The urge to make discomfort stop right away is usually what leads to a worse decision than the discomfort itself. Most distress peaks and drops on its own if you let it run its course instead of acting to end it immediately.', how:'After you hold a boundary or push back, resist the urge to fix the other person\'s reaction, over-explain, chase reassurance, or undo your decision just to make the discomfort stop.' },
    { n:15, title:'Change the Climate', category:'Psychological Protection', phrase:'Do not let the most negative person set the emotional temperature around you.', why:'Emotional contagion spreads through a team without anyone choosing it, and the loudest cynicism in the room usually wins by default. Reinforcing competence, humor, and progress on purpose keeps someone else\'s mood from setting the tone for everyone.', how:'Notice emotional contagion as it happens. Deliberately reinforce competence, humor, progress, and constructive connection so someone else\'s cynicism or volatility does not become the climate you operate in.' },
    { n:16, title:'Create the Record', category:'Evidence Building', phrase:'Make the paper trail before you know you need it.', why:'A record built after a conflict starts looks reconstructed, while one built as a normal habit looks credible. Documenting decisions and instructions as they happen protects you long before you know you will need the proof.', how:'Build documentation into normal work: recap decisions, deadlines, ownership, approvals, scope changes, priority changes, and verbal instructions in writing so the record is harder to rewrite later.' },
    { n:17, title:'Build Your Evidence File', category:'Evidence Building', phrase:'Preserve the material that lets someone else reach the conclusion.', why:'Stating your interpretation is easy to dismiss, but the underlying material speaks for itself. Saving the original instructions, messages, and changes lets a reader draw the same conclusion you did without being told what to think.', how:'Save the before-and-after evidence: original instructions, earlier praise, changed deadlines, policy language, reassigned work, screenshots, messages, and other material that supports what changed without stating the conclusion for them.' },
    { n:18, title:'Document Your Wins', category:'Performance Protection', phrase:'Do not leave your competence in somebody else\'s memory.', why:'Memory is unreliable and selective, especially for someone with a reason to remember you unfavorably. A running record of your own results means your competence does not depend on anyone else\'s recollection.', how:'Keep a running record of results, praise, completed projects, improvements, problems solved, leadership, invisible labor, and other outcomes so you can show what you contributed.' },
    { n:19, title:'Protect Your Reputation', category:'Reputation Strategy', phrase:'Make it harder for one person to control how everybody else sees you.', why:'A single hostile narrator can shape how a whole team sees your work if nobody else has visibility into it. Building real relationships and making your contributions visible gives other people their own basis for judging you.', how:'Build real working relationships with people who know your work, make useful contributions visible, correct false narratives when needed, protect credit, and maintain credible connections before you need them.' },
    { n:20, title:'Know Your Conflict Style', category:'Conflict Strategy', phrase:'Know what you tend to do first when conflict shows up.', why:'Everyone defaults to a conflict style under pressure, and that default is not always the right tool for what is happening. Naming your pattern is the first step to choosing your response instead of running it automatically.', how:'Identify your default conflict response and notice how it changes depending on who has power in the interaction.' },
    { n:21, title:'Flex Your Style', category:'Conflict Strategy', phrase:'Your default response is not always the right response.', why:'The style that works with a peer will not always work with someone who holds power over you, and treating every conflict the same way limits what you can accomplish. Reading the situation and adjusting your approach is what makes conflict skill useful instead of habitual.', how:'Choose a conflict approach based on the situation instead of using the same instinct every time.' },
    { n:22, title:'Have the Crucial Conversation', category:'Direct Resolution', phrase:'Address the issue before the story around it gets bigger.', why:'Problems left unaddressed rarely stay the same size, and avoiding the conversation often costs more than having it. A clear, specific conversation gives the other person the chance to actually respond to the issue.', how:'Describe what you have noticed without deciding motive, state the impact, and ask directly about the shift or problem.' },
    { n:23, title:'Know When to Escalate', category:'Escalation Decision', phrase:'Direct resolution has limits.', why:'Some situations genuinely cannot be resolved at the level where they started, and waiting too long to move them can cost you options. Assessing whether direct resolution is working tells you when it is time to take the issue higher.', how:'Assess whether the issue has been addressed appropriately, whether the behavior is continuing, whether direct resolution is safe or realistic, and whether the risk or authority required now belongs at a higher level.' },
    { n:24, title:'Build the Case', category:'Strategic Escalation', phrase:'Do not escalate with a pile. Escalate with a case.', why:'A stack of complaints is harder to act on than a clear, organized concern. Structuring what you already have into a defined issue, an impact, and a specific ask is what makes escalation land.', how:'Organize the concern so another person can evaluate it: define the issue, explain the impact, select the evidence that establishes the problem, note what you have already tried when relevant, and make a specific workable ask.' },
    { n:25, title:'Know Your Terrain', category:'Situational Assessment', phrase:'Before you escalate, understand the system you are moving through.', why:'Escalating without understanding the terrain means guessing at who has authority, what the actual process is, and what a route can realistically change. Knowing the system first tells you where an escalation is likely to go.', how:'Identify formal expectations, relevant policies and channels, decision routes, unwritten norms, communication pathways, who owns which decisions, and what each route can realistically change.' },
    { n:26, title:'Map the Power', category:'Political Skill / Situational Assessment', phrase:'The org chart is not the whole power structure.', why:'Formal titles do not always match who actually controls information, access, and decisions. Mapping the real influence in a workplace tells you who is worth talking to and who only looks like the right person on paper.', how:'Map formal authority and informal influence: who controls information, access, decisions, resources, credibility, and opportunities; who influences whom; and whose view of your work carries weight.' },
    { n:27, title:'Build Allies', category:'Political Skill / Resource Building', phrase:'Do not wait until you are isolated to build relationships.', why:'Relationships built during a crisis look transactional and rarely hold up under pressure. Building reciprocal, credible connections before you need them is what gives you real support when a situation gets difficult.', how:'Strengthen legitimate, reciprocal working relationships with people who know your work, provide context, share accurate information, offer practical help, or can independently speak to your credibility.' },
    { n:28, title:'Choose Your Timing', category:'Political Skill / Decision-Making', phrase:'The right response at the wrong time can still cost you leverage.', why:'The same accurate point can land completely differently depending on when it is raised. Reading the timing around a decision is often what determines whether being right actually changes anything.', how:'Assess urgency, evidence, audience, decision points, and consequences. Decide when to raise the issue, when to put it in writing, when to wait, and when timing changes the odds of being heard.' },
    { n:29, title:'Notice What Changes After You Act', category:'Pattern Recognition / Risk Assessment', phrase:'Your response gives you information about the system.', why:'What happens after you set a boundary or escalate tells you something real about how the system responds to you. Tracking the actual changes instead of assuming an outcome keeps your next move based on evidence.', how:'Compare before and after. Track changes in assignments, access, scrutiny, feedback, expectations, communication, or relationships after you set a boundary, correct misinformation, or escalate, then document facts before interpreting the change.' },
    { n:30, title:'Build Your Strategy Map', category:'Decision-Making (Capstone)', phrase:'Stop reacting case by case. Build a plan for how you will operate.', why:'This is the capstone. The whole challenge builds toward the ability to choose a response on purpose instead of reacting to whatever happens next.', how:'Pull the challenge together: decide what you will respond to, document, clarify, make visible, work around, seek support for, escalate, reduce exposure to, or leave. Define what would make you change strategy.' }
  ];

  function unlockDate(n){
    const start = new Date(CHALLENGE_START_DATE + 'T00:00:00');
    const d = new Date(start);
    d.setDate(d.getDate() + (n - 1));
    return d;
  }
  function isUnlocked(n){
    const today = new Date();
    today.setHours(0,0,0,0);
    return unlockDate(n) <= today;
  }
  function formatDate(d){
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }

  function getDone(){
    try { return JSON.parse(localStorage.getItem('fw_challenge_done')||'{}'); }
    catch(e){ return {}; }
  }
  function setDone(obj){
    try { localStorage.setItem('fw_challenge_done', JSON.stringify(obj)); } catch(e){}
  }

  const grid = document.getElementById('grid');
  const detailScreen = document.getElementById('detailScreen');
  const detailContent = document.getElementById('detailContent');
  const homeHead = document.getElementById('homeHead');
  const backBtn = document.getElementById('backBtn');

  function renderProgress(){
    const done = getDone();
    const count = Object.values(done).filter(Boolean).length;
    document.getElementById('progressFill').style.width = (count/30*100) + '%';
    document.getElementById('progressCount').textContent = count + ' / 30';
  }

  function renderGrid(){
    grid.innerHTML = '';
    const done = getDone();
    STRATEGIES.forEach(s => {
      const unlocked = isUnlocked(s.n);
      const isDone = !!done[s.n];
      const card = document.createElement('div');
      card.className = 'card' + (!unlocked ? ' locked' : '') + (isDone ? ' done' : '');
      if (unlocked) {
        card.innerHTML =
          '<div class="card-top">' +
            '<div class="card-num">Strategy ' + s.n + '</div>' +
            (isDone ? '<div class="card-state done-tag">&#10003; Done</div>' : '') +
          '</div>' +
          '<div class="card-title">' + s.title + '</div>' +
          '<div class="card-meta">' + phaseFor(s.n) + '</div>';
      } else {
        card.innerHTML =
          '<div class="card-top">' +
            '<div class="card-num">Strategy ' + s.n + '</div>' +
            '<div class="card-state locked-tag">Locked</div>' +
          '</div>' +
          '<div class="card-unlock-date">Unlocks ' + formatDate(unlockDate(s.n)) + '</div>';
      }
      if (unlocked) card.addEventListener('click', () => openDetail(s.n));
      grid.appendChild(card);
    });
  }

  function openDetail(n){
    const s = STRATEGIES.find(s => s.n === n);
    const unlocked = isUnlocked(n);
    homeHead.hidden = true;
    grid.hidden = true;
    detailScreen.hidden = false;

    if (!unlocked) {
      detailContent.innerHTML =
        '<div class="locked-screen"><div class="lock-title">Not unlocked yet</div>' +
        '<p>Strategy ' + n + ' unlocks ' + formatDate(unlockDate(n)) + '.</p></div>';
      return;
    }

    const done = getDone();
    const isDone = !!done[n];
    const tool = TOOL_LINKS[n];

    let bodyHtml;
    if (s.why || s.how) {
      bodyHtml =
        (s.phrase ? '<p class="phrase-line">' + s.phrase + '</p>' : '') +
        (s.why ? '<div class="section-block"><div class="section-label">Why This Helps</div><p class="section-text">' + s.why + '</p></div>' : '') +
        (s.how ? '<div class="section-block"><div class="section-label">How To Do It</div><p class="section-text">' + s.how + '</p></div>' : '');
    } else {
      bodyHtml = '<p class="detail-body">' + s.body + '</p>';
    }

    let toolHtml = '';
    if (tool) {
      const boxLabel = tool.label || 'Today\u2019s Tool';
      const ctaText = tool.cta || 'Open the tool';
      toolHtml =
        '<div class="tool-box">' +
          '<div class="tool-box-label">' + boxLabel + '</div>' +
          '<div class="tool-box-name">' + tool.name + '</div>' +
          (tool.url
            ? '<a class="tool-link" href="' + tool.url + '" target="_blank" rel="noreferrer">' + ctaText + ' &rarr;</a>'
            : '<span class="no-tool-note">Link coming soon.</span>') +
        '</div>';
    }

    detailContent.innerHTML =
      '<div class="detail-eyebrow">Strategy ' + n + ' &middot; ' + phaseFor(n) + '</div>' +
      '<h1 class="detail-title">' + s.title + '</h1>' +
      bodyHtml +
      toolHtml +
      '<div class="complete-row">' +
        '<button class="complete-btn' + (isDone ? ' is-done' : '') + '" id="completeBtn">' +
          '<span class="pulse-ring" id="pulseRing"></span>' +
          (isDone ? '&#10003; Marked Complete' : 'Mark Strategy Complete') +
        '</button>' +
      '</div>';

    document.getElementById('completeBtn').addEventListener('click', function(){
      const d = getDone();
      d[n] = !d[n];
      setDone(d);
      const ring = document.getElementById('pulseRing');
      ring.classList.remove('go');
      void ring.offsetWidth;
      if (d[n]) ring.classList.add('go');
      openDetail(n);
      renderProgress();
    });
  }

  backBtn.addEventListener('click', function(){
    detailScreen.hidden = true;
    homeHead.hidden = false;
    grid.hidden = false;
    renderGrid();
    renderProgress();
  });

  renderGrid();
  renderProgress();
})();
</script>
</body>
</html>
